<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Paradiso Guitar Quartet & Bass</title>
    <script type="text/javascript">
      // GitHub Pages has no server-side rewrite for client-side routes, so a
      // direct hit to e.g. /contatti 404s before React Router can handle it.
      // This encodes the path into a query string and redirects to the SPA
      // root, where the inline script in index.html restores it via
      // history.replaceState before React Router mounts.
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
